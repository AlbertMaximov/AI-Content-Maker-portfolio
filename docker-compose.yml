version: '3.8'

services:
  ai-content-maker:
    build:
      context: .
    image: ai-content-maker:latest
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    restart: unless-stopped
